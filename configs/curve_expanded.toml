# Coverage-screened expansion; screening uses 2022 features, never evaluation returns.
# A retrospective protocol, not a claim of prior preregistration.
[paths]
bars = "data/market/shfe_all_registered_2020_2025/bars.csv"
metadata = "data/market/shfe_metadata_v2_20261029/metadata.csv"
warrants = "data/market/shfe_warrants_expanded_2020_2025/warrants.csv"
output = "reports/runs/curve_expanded"

[study]
analysis_role = "retrospective coverage-expansion sensitivity; not independent confirmation"
universe_selection = "observed by 2020-01-02 and >=80 percent common-feature availability in 2022"
codes = ["cu", "al", "zn", "rb", "hc", "ru", "bu", "sp", "au", "ag"]
start = "2020-01-01"
end = "2025-12-31"
evaluation_start = "2023-01-01"
holding_sessions = 20
entry_lag_sessions = 1
min_assets = 6
hac_lags = 40
min_inference_obs = 252
information_cutoff_local = "20:30:00"
retrospective_bar_availability = true
inventory_min_seasons = 3
inventory_min_observations = 24

[curve]
min_days = 60
max_days = 540
min_volume = 100
min_open_interest = 1000
momentum_sessions = 126
basis_momentum_sessions = 252
