[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-factor-lab"
version = "0.17.0"
description = "Reproducible factor research for Chinese commodity futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1.2,<2", "statsmodels>=0.14,<0.16"]
ingest = ["python-calamine>=0.3,<1"]

[project.scripts]
cfl = "commodity_factor_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
